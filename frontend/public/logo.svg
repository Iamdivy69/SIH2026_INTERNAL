<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056FF"/>
      <stop offset="100%" stop-color="#002680"/>
    </linearGradient>
    <linearGradient id="pStyle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2EEFF"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark Container -->
  <g transform="translate(10, 10)">
    <rect width="80" height="80" rx="20" fill="url(#iconBg)"/>
    <rect width="78" height="78" x="1" y="1" rx="19" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"/>
    
    <!-- Stylized P -->
    <rect x="24" y="20" width="10" height="40" rx="5" fill="url(#pStyle)"/>
    <path d="M 28 20 L 48 20 C 59 20 66 27 66 37 C 66 47 59 54 48 54 L 28 54" fill="none" stroke="url(#pStyle)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="48" cy="37" r="4" fill="#0056FF"/>
  </g>

  <!-- Logo Typography -->
  <text x="108" y="58" font-family="'Outfit', 'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5" fill="currentColor">
    PARAKH <tspan fill="#0056FF">AI</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="110" y="78" font-family="'Outfit', 'Inter', system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" letter-spacing="1.5" fill="#64748B">
    ADAPTIVE ASSESSMENT
  </text>
</svg>
