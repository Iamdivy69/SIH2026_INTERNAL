<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056FF"/>
      <stop offset="100%" stop-color="#002680"/>
    </linearGradient>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D0E2FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Rounded Base Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8"/>

  <!-- Stylized AI 'P' Mark -->
  <g filter="url(#glow)">
    <!-- Vertical Spine -->
    <rect x="140" y="112" width="56" height="288" rx="28" fill="url(#pGrad)"/>
    
    <!-- Outer Loop Arc -->
    <path d="M 168 112 L 280 112 C 348 112 400 164 400 232 C 400 300 348 352 280 352 L 168 352" fill="none" stroke="url(#pGrad)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- AI Circuit Neural Node Dots -->
    <circle cx="280" cy="232" r="28" fill="#0056FF"/>
    <circle cx="280" cy="232" r="14" fill="#FFFFFF"/>
    
    <circle cx="396" cy="156" r="16" fill="#38BDF8"/>
    <circle cx="396" cy="308" r="16" fill="#38BDF8"/>
  </g>
</svg>